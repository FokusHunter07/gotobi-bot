name: Unduh Data XAUUSD

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gotobi-bot
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Unduh data emas dari Dukascopy
        run: python xau_data.py

      - name: Simpan data
        run: |
          git config user.name "gotobi-bot"
          git config user.email "gotobi-bot@users.noreply.github.com"
          git add data/xauusd_m5.csv.gz
          if git diff --cached --quiet; then
            echo "Tidak ada data baru."
          else
            git commit -m "Data XAUUSD $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
