name: Gotobi Paper Trading Bot

on:
  schedule:
    - cron: "20 0 * * 1-5"   # 07:20 WIB  -> pengingat gotobi (Goto & Asli, hanya di tanggal gotobi)
    - cron: "35 1 * * 1-5"   # 08:35 WIB  -> laporan (Kamis, Senin malam, percobaan pertama Goto/Asli)
    - cron: "40 2 * * 1-5"   # 09:40 WIB  -> laporan Goto & Asli (data Dukascopy biasanya sudah ada)
    - cron: "30 3 * * 1-5"   # 10:30 WIB  -> cadangan
    - cron: "40 9 * * 1-5"   # 16:40 WIB  -> laporan Emas (posisi tutup 14:00/15:00 WIB)
    - cron: "0 12 * * 1-5"   # 19:00 WIB  -> cadangan kedua
    - cron: "35 1 * * 6"     # Sabtu 08:35 WIB -> laporan Jumat (posisi tutup Sabtu 02:40 WIB)
    - cron: "0 4 * * 6"      # Sabtu 11:00 WIB -> cadangan
    - cron: "0 2 1 * *"      # tgl 1 tiap bulan 09:00 WIB -> klasemen bulanan
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: test / signal / report / summary / menu"
        required: true
        default: "test"

permissions:
  contents: write

concurrency:
  group: gotobi-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Tentukan mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "20 0 * * 1-5" ]; then
            echo "mode=signal" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 2 1 * *" ]; then
            echo "mode=summary" >> "$GITHUB_OUTPUT"
          else
            echo "mode=report" >> "$GITHUB_OUTPUT"
          fi

      - name: Jalankan bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBAPP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python gotobi_bot.py "${{ steps.mode.outputs.mode }}"

      - name: Simpan catatan trade
        run: |
          git config user.name "gotobi-bot"
          git config user.email "gotobi-bot@users.noreply.github.com"
          git add trades*.csv xau_hourly.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Tidak ada catatan baru."
          else
            git commit -m "Catat trade $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
