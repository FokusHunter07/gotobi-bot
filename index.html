<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kantor GotobiAgus</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Warna: "senja di kantor" — lembut, kontras cukup, tidak menyilaukan ===== */
:root{
  --bg:#181b28; --panel:#212538; --panel2:#272c42; --line:#343a55; --soft:#2b3048;
  --text:#e9e7f3; --muted:#9a9db8; --faint:#6f7393;
  --green:#8fd1b0; --red:#ec9a9a; --amber:#e9c483; --blue:#9db2f2; --accent:#b3a6ee;
  --wallL:#d6d8e7; --wallR:#c6cadc; --floor:#abb1c9; --floorLine:#9ea5bf;
  --bubble:#2a2f47; --tagbg:rgba(33,37,56,.92);
  --room-light:1;
  --ease:cubic-bezier(.22,.8,.24,1);
}
:root[data-theme="light"]{
  --bg:#f2f1f7; --panel:#ffffff; --panel2:#fbfaff; --line:#e3e1ee; --soft:#f0eef8;
  --text:#272538; --muted:#6c6984; --faint:#9a97b0;
  --green:#2f9a6c; --red:#cf5f5f; --amber:#b5862a; --blue:#4f6bd0; --accent:#6c5bd4;
  --wallL:#e4e6f2; --wallR:#d6d9e8; --floor:#c2c7dc; --floorLine:#b3b9d0;
  --bubble:#ffffff; --tagbg:rgba(255,255,255,.94);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f1f7; --panel:#ffffff; --panel2:#fbfaff; --line:#e3e1ee; --soft:#f0eef8;
    --text:#272538; --muted:#6c6984; --faint:#9a97b0;
    --green:#2f9a6c; --red:#cf5f5f; --amber:#b5862a; --blue:#4f6bd0; --accent:#6c5bd4;
    --wallL:#e4e6f2; --wallR:#d6d9e8; --floor:#c2c7dc; --floorLine:#b3b9d0;
    --bubble:#ffffff; --tagbg:rgba(255,255,255,.94);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:"Nunito",system-ui,sans-serif;font-weight:600;-webkit-font-smoothing:antialiased;
  max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:28px;transition:background .6s var(--ease),color .6s var(--ease)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
header h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
header small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.live{font-size:12px;font-weight:800;color:var(--green);background:var(--panel);border:1px solid var(--line);padding:5px 11px;border-radius:99px;display:flex;gap:7px;align-items:center;font-variant-numeric:tabular-nums}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* tab dengan indikator yang meluncur */
.tabs{position:relative;display:flex;gap:2px;margin:2px 14px 12px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .ind{position:absolute;top:4px;left:0;height:calc(100% - 8px);border-radius:12px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);transition:transform .38s var(--ease),width .38s var(--ease);z-index:0}
.tabs button{position:relative;z-index:1;flex:1 0 auto;font-size:13px;font-weight:700;color:var(--muted);background:none;border:0;border-radius:12px;padding:8px 11px;cursor:pointer;transition:color .3s var(--ease);white-space:nowrap}
.tabs button.on{color:var(--text)}

.board{margin:0 14px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px;min-height:168px;transition:opacity .22s var(--ease),transform .22s var(--ease)}
.board.out{opacity:0;transform:translateY(6px)}
.board .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.board .top span{font-size:15px;font-weight:800}
.board .top b{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.rule{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.stat span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.stat strong{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green)} .neg{color:var(--red)}
.rank{list-style:none;margin-top:4px}
.rank li{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .m{font-size:19px;text-align:center}
.rank .n{font-weight:800;font-size:15px}
.rank .n small{display:block;font-weight:600;font-size:11.5px;color:var(--muted);margin-top:2px}
.rank .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
.rank .v small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}

.room{position:relative;margin:14px 0 2px}
.room svg{display:block;width:100%;height:auto;filter:brightness(var(--room-light)) saturate(calc(.75 + var(--room-light)*.25));transition:filter 3s ease}
.bubble{position:absolute;transform:translate(-50%,-100%) scale(1);transform-origin:50% 100%;background:var(--bubble);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:9px 12px;font-size:12.5px;line-height:1.45;max-width:62%;min-width:140px;box-shadow:0 10px 30px rgba(10,12,30,.25);transition:opacity .45s var(--ease),transform .45s var(--ease),left .6s var(--ease),top .6s var(--ease);pointer-events:none;z-index:3}
.bubble b{display:block;font-size:11.5px;margin-bottom:2px;font-weight:800}
.bubble:after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:var(--bubble);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.bubble.hide{opacity:0;transform:translate(-50%,-92%) scale(.96)}
.tag{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--tagbg);color:var(--text);border:1px solid var(--line);white-space:nowrap;z-index:2;backdrop-filter:blur(4px);transition:opacity .4s var(--ease)}
.tag i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;background:var(--blue);vertical-align:1px;transition:background .6s var(--ease)}
.room.focus .tag{opacity:.35}
.room.focus .tag.me{opacity:1}

.card{margin:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 small{font-size:12px;color:var(--muted);font-weight:700}
.sched,.feed{list-style:none}
.sched li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sched li:first-child{border-top:0}
.sched .w{font-size:14px;font-weight:800}
.sched .w small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.sched .c{font-size:14px;font-weight:800;color:var(--amber);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dep{font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.dep b{color:var(--amber)}
.feed{max-height:360px;overflow:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.feed li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.feed li:first-child{border-top:0}
.feed .d{color:var(--muted);font-size:12px;margin-top:2px;font-weight:600}
.feed .r{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:6px 0;line-height:1.5}
.foot{color:var(--faint);font-size:11.5px;text-align:center;padding:4px 20px;line-height:1.5}

/* animasi karakter: pelan & lembut */
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.type .armL{animation:typeL .34s ease-in-out infinite alternate}.type .armR{animation:typeR .34s .17s ease-in-out infinite alternate}
@keyframes typeL{to{transform:translateY(-2px)}}@keyframes typeR{to{transform:translateY(-2px)}}
.sleep .head{transform:rotate(12deg);transform-box:fill-box;transform-origin:center bottom;transition:transform 1s var(--ease)}
.party{animation:jump .9s var(--ease) infinite}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-8px)}}
.sad .head{transform:translateY(2px)}
.blink{animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{opacity:1}97%{opacity:.15}}
.led{animation:led 2.2s ease-in-out infinite}
@keyframes led{50%{opacity:.25}}
.steam path{animation:steam 3.6s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:1.8s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.6}100%{opacity:0;transform:translateY(-10px)}}
.zzz text{animation:zz 3.6s ease-in-out infinite;opacity:0;font-weight:800}
.zzz text:nth-child(2){animation-delay:1.2s}.zzz text:nth-child(3){animation-delay:2.4s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-22px)}}
.chartline{stroke-dasharray:140;animation:draw 6s linear infinite}
@keyframes draw{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important;transition-duration:0s!important}
}
</style>
</head>
<body>
<header>
  <div><h1>Kantor GotobiAgus</h1><small id="updated">Memuat data…</small></div>
  <div class="live"><i></i><span id="clock">--:--:--</span></div>
</header>

<nav class="tabs" id="tabs"></nav>
<section class="board" id="board"></section>

<section class="room" id="room">
  <svg id="scene" viewBox="0 0 400 330" aria-label="Kantor animasi empat bot"></svg>
  <div class="bubble hide" id="bubble"><b id="who">GOTO</b><span id="say">…</span></div>
  <div id="tags"></div>
</section>

<section class="card">
  <h2>Jadwal berikutnya</h2>
  <ul class="sched" id="sched"></ul>
  <div class="dep" id="nextDep">Setoran virtual berikutnya: –</div>
</section>

<section class="card">
  <h2>Aktivitas <small id="feedTitle">Semua bot</small></h2>
  <ul class="feed" id="feed"><li class="empty">Memuat…</li></ul>
</section>
<p class="foot">Simulasi tanpa uang sungguhan. Tiap bot punya akun virtual $100, ditambah setoran $50 tiap 2 bulan, risiko 1% per trade.</p>

<script>
/* ===================== KONFIGURASI ===================== */
const START = 100, DEPOSIT = 50, DEP_EVERY = 2, SIM_START = [2026,9,20];   // bulan 0-based
const GOTOBI = [5,10,15,20,25,30];
const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const BOTS = {
  goto:  {nama:"Goto",  emoji:"⚡", pasar:"USD/JPY", file:"trades.csv",       unit:"pip", color:"var(--amber)",
          head:"#f6cf7e", cap:"#eab35a", body:"#8478d6", arm:"#7468c6", desk:"#8478d6",
          aturan:"SELL tanggal gotobi 07:55 WIB · SL 10 pip · close 08:20 WIB"},
  asli:  {nama:"Asli",  emoji:"⏰", pasar:"USD/JPY", file:"trades_asli.csv",  unit:"pip", color:"#7fd3ff",
          head:"#d5dae6", cap:"#a5afc4", body:"#5f93c4", arm:"#5285b5", desk:"#5f93c4",
          aturan:"SELL tanggal gotobi 07:55 WIB · SL 10 pip · close 08:30 WIB (versi lama)"},
  kamis: {nama:"Kamis", emoji:"🌙", pasar:"USD/JPY", file:"trades_kamis.csv", unit:"pip", color:"#a9b8ff",
          head:"#a3b3ef", cap:"#8597df", body:"#3f4a8c", arm:"#37417c", desk:"#5966ad",
          aturan:"BUY tiap Kamis 02:15 WIB · SL 10 pip · close 02:50 WIB"},
  emas:  {nama:"Emas",  emoji:"🥇", pasar:"XAU/USD", file:"trades_emas.csv",  unit:"$",   color:"#ffd56b",
          head:"#f3dc9b", cap:"#e2bd5c", body:"#c9a24a", arm:"#b8933e", desk:"#c9a24a",
          aturan:"BUY 16:30 New York (03:30/04:30 WIB) Sen–Kam NY · SL 0,5×ATR · TP 1R · close 03:00 NY (14:00/15:00 WIB)"},
};
const ORDER = ["goto","asli","kamis","emas"];
let TR = {goto:[],asli:[],kamis:[],emas:[]};
let TAB = "all";
try{ TAB = localStorage.getItem("kantorTab") || "all"; }catch(e){}

/* ===================== WAKTU ===================== */
const wib = () => new Date(Date.now() + 7*3600e3);          // getUTC* = jam WIB
const pad = n => String(n).padStart(2,"0");
const fmtTime = d => [d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds()].map(pad).join(":");
const NYF = new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour12:false,year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",weekday:"short"});
function nyParts(date){
  const p={}; NYF.formatToParts(date).forEach(x=>p[x.type]=x.value);
  const dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday);
  return {y:+p.year,m:+p.month,d:+p.day,h:(+p.hour)%24,mi:+p.minute,dow};
}
function nyToDate(y,m,d,h,mi){        // jam New York -> Date (UTC)
  let guess = Date.UTC(y,m-1,d,h+4,mi);
  for(let i=0;i<2;i++){ const p=nyParts(new Date(guess)); const diff=(Date.UTC(p.y,p.m-1,p.d,p.h,p.mi)-Date.UTC(y,m-1,d,h,mi)); guess-=diff; }
  return new Date(guess);
}
const toWib = d => new Date(d.getTime()+7*3600e3);

/* ===================== DATA ===================== */
function parseCSV(t){
  const L=t.trim().split(/\r?\n/); if(L.length<2) return [];
  const h=L[0].split(","); return L.slice(1).filter(Boolean).map(l=>{const v=l.split(",");const o={};h.forEach((k,i)=>o[k]=v[i]||"");return o});
}
async function loadAll(){
  let ok=0;
  await Promise.all(ORDER.map(async k=>{
    try{ const r=await fetch(BOTS[k].file+"?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw 0;
         TR[k]=parseCSV(await r.text()).sort((a,b)=>a.tanggal<b.tanggal?-1:1); ok++; }
    catch(e){ TR[k]=[]; }
  }));
  $("updated").textContent = ok ? "Diperbarui "+fmtTime(wib())+" WIB" : "Belum ada catatan trade";
  render();
}
const $ = id => document.getElementById(id);
const money = v => (v<0?"-$":"$")+Math.abs(v).toFixed(2);
function stats(arr){
  const n=arr.length, last=n?arr[n-1]:null, bal=last?+last.saldo:START;
  const dep=last&&last.modal_disetor?+last.modal_disetor:START;
  const wins=arr.filter(t=>+t.R>0).length, totR=arr.reduce((s,t)=>s+ +t.R,0);
  let idx=1,peak=1,dd=0; arr.forEach(t=>{idx*=1+0.01*(+t.R);peak=Math.max(peak,idx);dd=Math.min(dd,(idx-peak)/peak)});
  return {n,bal,dep,wins,totR,dd,profit:bal-dep,ret:(bal-dep)/dep*100,wr:n?wins/n*100:null};
}

/* ===================== PANEL ===================== */
function renderTabs(){
  const items=[["all","🏆 Klasemen"],...ORDER.map(k=>[k,BOTS[k].emoji+" "+BOTS[k].nama])];
  if(!$("tabs").children.length){
    $("tabs").innerHTML=`<span class="ind" id="ind"></span>`+items.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join("");
    $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(b.dataset.k===TAB) return; TAB=b.dataset.k;
      try{localStorage.setItem("kantorTab",TAB)}catch(e){}; switchTab(); });
  }
  $("tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===TAB));
  moveInd();
}
function moveInd(){
  const on=$("tabs").querySelector("button.on"); if(!on) return;
  $("ind").style.width=on.offsetWidth+"px"; $("ind").style.transform=`translateX(${on.offsetLeft}px)`;
  on.scrollIntoView({behavior:"smooth",inline:"nearest",block:"nearest"});
}
let swapping=false;
function switchTab(){
  renderTabs();
  const b=$("board"); b.classList.add("out");
  setTimeout(()=>{ renderBoard(true); renderFeed(); renderSched(); updateStates(); b.classList.remove("out"); think(); },220);
}
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el,to,fmt){
  if(REDUCED){ el.textContent=fmt(to); return; }
  const t0=performance.now(), dur=650, from=0;
  const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=fmt(from+(to-from)*e); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function renderBoard(animate){
  if(TAB==="all"){
    const rows=ORDER.map(k=>({k,s:stats(TR[k])})).sort((a,b)=>(b.s.n?b.s.ret:-1e9)-(a.s.n?a.s.ret:-1e9));
    const medal=["🥇","🥈","🥉","4️⃣"];
    $("board").innerHTML=`<div class="top"><span>Klasemen</span><b>profit dari total setoran</b></div><ul class="rank">`+
      rows.map((r,i)=>{const b=BOTS[r.k],s=r.s;
        return `<li><span class="m">${medal[i]}</span><div class="n">${b.emoji} ${b.nama}<small>${b.pasar}, ${s.n} trade, menang ${s.n?s.wr.toFixed(0)+"%":"–"}</small></div>
        <div class="v ${s.profit>=0?'pos':'neg'}">${s.n?(s.ret>=0?"+":"")+s.ret.toFixed(1)+"%":"–"}<small>saldo ${money(s.bal)}</small></div></li>`}).join("")+`</ul>`;
    return;
  }
  const b=BOTS[TAB], s=stats(TR[TAB]);
  $("board").innerHTML=`<div class="top"><span>${b.emoji} ${b.nama}</span><b>${b.pasar} · akun virtual</b></div>
   <div class="rule">${b.aturan}</div>
   <div class="stats">
    <div class="stat"><span>Profit bersih</span><strong id="cProfit" class="${s.profit>=0?'pos':'neg'}">${(s.profit>=0?"+":"")+money(s.profit)}</strong></div>
    <div class="stat"><span>Saldo</span><strong id="cBal">${money(s.bal)}</strong></div>
    <div class="stat"><span>Modal disetor</span><strong>$${s.dep.toFixed(0)}</strong></div>
    <div class="stat"><span>Win rate</span><strong>${s.n?s.wr.toFixed(1)+"%":"–"}</strong></div>
    <div class="stat"><span>Trade · Total R</span><strong class="${s.totR>=0?'pos':'neg'}" style="font-size:15px">${s.n} · ${(s.totR>=0?"+":"")+s.totR.toFixed(2)}R</strong></div>
    <div class="stat"><span>Max DD</span><strong>${(s.dd*100).toFixed(1)}%</strong></div>
   </div>`;
  if(animate){ countUp($("cProfit"),s.profit,v=>(v>=0?"+":"")+money(v)); countUp($("cBal"),s.bal,money); }
}
function renderFeed(){
  let all=[];
  ORDER.forEach(k=>{ if(TAB==="all"||TAB===k) TR[k].forEach(t=>all.push({k,t})); });
  all.sort((a,b)=>(b.t.tanggal+(b.t.jam_entry_wib||"")).localeCompare(a.t.tanggal+(a.t.jam_entry_wib||"")));
  $("feedTitle").textContent = TAB==="all" ? "Semua bot" : BOTS[TAB].emoji+" "+BOTS[TAB].nama;
  if(!all.length){ $("feed").innerHTML=`<li class="empty">Belum ada trade tercatat. Hasil pertama muncul di sini setelah jadwal berikutnya selesai.</li>`; return; }
  $("feed").innerHTML=all.slice(0,30).map(({k,t})=>{
    const b=BOTS[k], win=+t.R>0, d=new Date(t.tanggal+"T00:00:00Z");
    const dep=+t.setoran>0?` <span style="color:var(--amber);font-size:11.5px">+$${(+t.setoran).toFixed(0)} setoran</span>`:"";
    const mv = b.unit==="pip" ? `${(+t.pips>0?"+":"")+(+t.pips).toFixed(1)} pip` : `${(+t.pips>0?"+":"")+(+t.pips).toFixed(2)} $/oz`;
    return `<li><div>${win?"✅":"❌"} ${b.emoji} <b>${b.nama}</b> <span style="color:var(--muted)">${HARI[d.getUTCDay()]} ${d.getUTCDate()} ${BULAN[d.getUTCMonth()]}</span>${dep}
      <div class="d">${t.arah||"SELL"} ${t.entry} ke ${t.exit}, ${t.hasil.toLowerCase()}</div></div>
      <div class="r ${win?'pos':'neg'}">${mv}<div class="d">${money(+t.pl_usd)} (${(+t.R>0?"+":"")+(+t.R).toFixed(2)}R)</div></div></li>`}).join("");
}

/* ===================== JADWAL ===================== */
function nextGotobi(){        // Date (UTC) of next 07:55 WIB on gotobi weekday
  const now=Date.now(); let w=wib();
  let d=Date.UTC(w.getUTCFullYear(),w.getUTCMonth(),w.getUTCDate(),0,55);   // 07:55 WIB = 00:55 UTC
  for(let i=0;i<40;i++){ const x=new Date(d+7*3600e3); if(d>now && GOTOBI.includes(x.getUTCDate()) && x.getUTCDay()>0 && x.getUTCDay()<6) return new Date(d); d+=864e5; }
}
function nextKamis(){         // Kamis 02:15 WIB = Rabu 19:15 UTC
  const now=Date.now(); const w=wib();
  let d=Date.UTC(w.getUTCFullYear(),w.getUTCMonth(),w.getUTCDate(),19,15)-864e5;
  for(let i=0;i<10;i++){ if(d>now && new Date(d).getUTCDay()===3) return new Date(d); d+=864e5; }
}
function nextEmas(){          // 16:30 New York, Senin-Kamis
  const now=new Date(); const p=nyParts(now);
  for(let i=0;i<8;i++){
    const base=new Date(Date.UTC(p.y,p.m-1,p.d+i,12));
    const q={y:base.getUTCFullYear(),m:base.getUTCMonth()+1,d:base.getUTCDate(),dow:base.getUTCDay()};
    if(q.dow<1||q.dow>4) continue;
    const t=nyToDate(q.y,q.m,q.d,16,30); if(t>now) return t;
  }
}
function countdown(t){
  const ms=t-Date.now(); const h=Math.floor(ms/3.6e6), m=Math.floor(ms%3.6e6/6e4), s=Math.floor(ms%6e4/1e3);
  return h>=24?`${Math.floor(h/24)} hari ${h%24} jam`:`${h}j ${pad(m)}m ${pad(s)}d`;
}
const fmtWib = t => { const x=toWib(t); return `${HARI[x.getUTCDay()]} ${x.getUTCDate()} ${BULAN[x.getUTCMonth()]}, ${pad(x.getUTCHours())}:${pad(x.getUTCMinutes())} WIB`; };
function nextDeposit(){
  const w=wib(); const today=Date.UTC(w.getUTCFullYear(),w.getUTCMonth(),w.getUTCDate());
  for(let k=1;k<200;k++){ let y=SIM_START[0], m=SIM_START[1]+DEP_EVERY*k; y+=Math.floor(m/12); m%=12;
    const last=new Date(Date.UTC(y,m+1,0)).getUTCDate(); const d=Date.UTC(y,m,Math.min(SIM_START[2],last)); if(d>today) return new Date(d); }
}
function renderSched(){
  const g=nextGotobi(), ka=nextKamis(), em=nextEmas();
  const rows=[["goto",g,"SELL USD/JPY"],["asli",g,"SELL USD/JPY"],["kamis",ka,"BUY USD/JPY"],["emas",em,"BUY XAU/USD"]]
    .filter(r=>TAB==="all"||TAB===r[0]).sort((a,b)=>a[1]-b[1]);
  $("sched").innerHTML=rows.map(([k,t,a])=>`<li><div class="w">${BOTS[k].emoji} ${BOTS[k].nama} <span style="color:var(--muted);font-weight:700">${a}</span><small>${fmtWib(t)}</small></div><div class="c">${countdown(t)}</div></li>`).join("");
  const nd=nextDeposit(); $("nextDep").innerHTML=`Setoran virtual berikutnya <b>$${DEPOSIT} per bot</b> pada ${nd.getUTCDate()} ${BULAN[nd.getUTCMonth()]} ${nd.getUTCFullYear()}`;
}

/* ===================== ADEGAN ISOMETRIK ===================== */
const K=17, CX=200, CY=150;
const P=(x,y,z=0)=>[CX+(x-y)*K, CY+(x+y)*K/2 - z*K];
const pts=(...a)=>a.map(p=>P(...p).map(v=>v.toFixed(1)).join(",")).join(" ");
const poly=(p,fill,extra="")=>`<polygon points="${p}" fill="${fill}" ${extra}/>`;
function box(x,y,z,w,d,h,top,left,right){
  return poly(pts([x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]),left)+
         poly(pts([x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]),right)+
         poly(pts([x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]),top);
}
function plant(x,y){
  const [sx,sy]=P(x+.35,y+.35,1);
  return box(x,y,0,.7,.7,.8,"#7a7f9e","#666b8a","#555a78")+
    `<g class="bob" style="animation-duration:${3+Math.random()*2}s"><circle cx="${sx}" cy="${sy-7}" r="11" fill="#6aae8c"/><circle cx="${sx-4}" cy="${sy-11}" r="6" fill="#86c7a3"/></g>`;
}
const DESK={asli:[0.7,0.5],goto:[5.6,0.5],kamis:[0.7,5.5],emas:[5.6,5.5]};
const ANCH={};
function desk(k){
  const b=BOTS[k],[x,y]=DESK[k];
  let s=box(x,y,0,2.8,1.2,1.5,"#f7f7fb","#e2e3ef","#cfd1e2");
  s+=poly(pts([x,y+1.2,1.5],[x+2.8,y+1.2,1.5],[x+2.8,y+1.2,1.35],[x,y+1.2,1.35]),b.desk);   // strip warna
  s+=box(x+.55,y+.2,1.5,1.7,.22,1.35,"#3a3f5c","#2c3150","#343a5a");                       // monitor
  s+=poly(pts([x+.65,y+.42,1.62],[x+2.15,y+.42,1.62],[x+2.15,y+.42,2.75],[x+.65,y+.42,2.75]),"#1f2440");
  const line = k==="emas" ? `<polyline class="chartline" fill="none" stroke="#e9c483" stroke-width="1.5" points="${pts([x+.8,y+.42,2.0],[x+1.1,y+.42,2.3],[x+1.4,y+.42,2.15],[x+1.7,y+.42,2.55],[x+2.0,y+.42,2.45])}"/>`
            : `<polyline class="chartline" fill="none" stroke="${k==='kamis'?'#8fd1b0':'#ec9a9a'}" stroke-width="1.5" points="${k==='kamis'?pts([x+.8,y+.42,2.0],[x+1.1,y+.42,2.2],[x+1.4,y+.42,2.1],[x+1.7,y+.42,2.5],[x+2.0,y+.42,2.6]):pts([x+.8,y+.42,2.5],[x+1.1,y+.42,2.3],[x+1.4,y+.42,2.45],[x+1.7,y+.42,2.05],[x+2.0,y+.42,1.95])}"/>`;
  s+=line;
  // mug / aksesori
  s+=box(x+2.3,y+.6,1.5,.3,.3,.4,"#fff","#e7e3ff","#d3cdf7");
  const [mx,my]=P(x+2.45,y+.75,1.95);
  s+=`<g class="steam"><path d="M${mx-2} ${my} q3 -5 0 -9" stroke="#fff" fill="none" stroke-width="1.1"/><path d="M${mx+2} ${my} q3 -5 0 -9" stroke="#fff" fill="none" stroke-width="1.1"/></g>`;
  // kursi
  s+=box(x+.75,y+1.8,0,1.3,1.1,.85,"#6b6f9e","#5a5e8c","#4c507b");
  // karakter (dari belakang)
  const [cx,cy]=P(x+1.4,y+2.3,.85);
  const extra = k==="asli" ? `<rect x="-11" y="-44" width="22" height="5" rx="2.5" fill="#8a94ad"/>`
              : k==="kamis" ? `<path d="M-1 -52 a5 5 0 1 0 6 -5 a4 4 0 1 1 -6 5z" fill="#ffe08a"/>`
              : k==="emas" ? `<path d="M-9 -44 l3 -7 l3 5 l3 -7 l3 7 l3 -5 l3 7 z" fill="#e6c56a" stroke="#b99447" stroke-width="1"/>`
              : `<line x1="0" y1="-45" x2="0" y2="-51" stroke="#3a3f5c" stroke-width="2"/><circle class="blink" cx="0" cy="-52" r="3" fill="#ec9a9a"/>`;
  s+=`<g id="bot_${k}" class="bob"><g transform="translate(${cx},${cy})">
      <ellipse cx="0" cy="-10" rx="12" ry="13" fill="${b.body}"/>
      <rect class="armL" x="-15" y="-16" width="6" height="11" rx="3" fill="${b.arm}"/>
      <rect class="armR" x="9" y="-16" width="6" height="11" rx="3" fill="${b.arm}"/>
      <g class="head"><circle cx="0" cy="-31" r="11" fill="${b.head}"/>
        <path d="M-11 -33 a11 11 0 0 1 22 0 z" fill="${b.cap}"/>${extra}</g>
    </g></g>`;
  const [zx,zy]=P(x+1.4,y+2.3,4.2);
  s+=`<g id="zzz_${k}" class="zzz" style="display:none"><text x="${zx+6}" y="${zy}" fill="#fff" font-size="9">z</text><text x="${zx+10}" y="${zy-6}" fill="#fff" font-size="11">z</text><text x="${zx+14}" y="${zy-12}" fill="#fff" font-size="13">Z</text></g>`;
  ANCH[k]={head:P(x+1.4,y+2.3,4.0), tag:P(x+1.4,y+3.4,0)};
  return s;
}
function scene(){
  let s=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="sky1" offset="0" stop-color="#7cc4ff"/><stop id="sky2" offset="1" stop-color="#cfe8ff"/></linearGradient></defs>`;
  s+=poly(pts([0,0,0],[0,10,0],[0,10,7],[0,0,7]),"var(--wallL)");
  s+=poly(pts([0,0,0],[10,0,0],[10,0,7],[0,0,7]),"var(--wallR)");

  for(let i=1;i<10;i++){ s+=`<line x1="${P(i,0)[0]}" y1="${P(i,0)[1]}" x2="${P(i,10)[0]}" y2="${P(i,10)[1]}" stroke="var(--floorLine)" stroke-width=".7"/>`;
    s+=`<line x1="${P(0,i)[0]}" y1="${P(0,i)[1]}" x2="${P(10,i)[0]}" y2="${P(10,i)[1]}" stroke="var(--floorLine)" stroke-width=".7"/>`; }

  s+=poly(pts([0,3.2,3.2],[0,7.6,3.2],[0,7.6,6.4],[0,3.2,6.4]),"#a3a8c8");

  s+=`<polyline points="${pts([0,5.4,3.4],[0,5.4,6.2])}" stroke="#a3a8c8" stroke-width="3"/>`;
  s+=`<g id="sun">${(()=>{const [x,y]=P(0,4.3,5.5);return `<circle cx="${x}" cy="${y}" r="6" fill="#f3d38b"/>`})()}</g>`;
  // rak buku (dinding kiri depan)
  s+=box(0,8.3,0,.7,1.6,3.4,"#a07e66","#b8937a","#8c6d58");
  ["#ec9a9a","#e9c483","#9db2f2"].forEach((c,i)=>{for(let r=0;r<3;r++){
    s+=poly(pts([.7,8.45+i*.45,.4+r*1.05],[.7,8.8+i*.45,.4+r*1.05],[.7,8.8+i*.45,1.15+r*1.05],[.7,8.45+i*.45,1.15+r*1.05]),c);}});

  s+=frame(.6,4.2,1.9,1.4,`<polyline class="chartline" fill="none" stroke="#8fd1b0" stroke-width="1.5" points="${pts([.8,0,4.5],[1.2,0,5.0],[1.6,0,4.7],[2.0,0,5.3],[2.3,0,5.1])}"/>`);
  s+=frame(3.0,4.5,1.4,1.5,`<text id="cal" x="${P(3.7,0,5.15)[0]}" y="${P(3.7,0,5.15)[1]}" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">--</text>
    <text x="${P(3.7,0,4.75)[0]}" y="${P(3.7,0,4.75)[1]}" font-size="5.5" fill="#e9c483" text-anchor="middle">GOTOBI</text>`);
  const [ckx,cky]=P(5.6,0,5.4);
  s+=`<circle cx="${ckx}" cy="${cky}" r="10" fill="#fff" stroke="#3a3f5c" stroke-width="2"/>
      <line id="hh" x1="${ckx}" y1="${cky}" x2="${ckx}" y2="${cky-5}" stroke="#3a3f5c" stroke-width="2" stroke-linecap="round"/>
      <line id="mh" x1="${ckx}" y1="${cky}" x2="${ckx}" y2="${cky-8}" stroke="#6a5ad8" stroke-width="1.4" stroke-linecap="round"/>`;
  s+=frame(6.8,4.3,1.9,1.4,`<polygon points="${pts([7.2,0,4.6],[8.3,0,4.6],[8.0,0,5.1],[7.5,0,5.1])}" fill="#e6c56a" stroke="#b99447" stroke-width="1"/>
     <text x="${P(7.75,0,5.3)[0]}" y="${P(7.75,0,5.3)[1]}" font-size="5.5" fill="#e9c483" text-anchor="middle">XAU</text>`);
  // server rack di pojok belakang kanan
  s+=box(9.0,.3,0,.8,.9,2.6,"#4f5478","#434866","#3a3f5c");
  [0,1,2].forEach(i=>{const [x,y]=P(9.8,.75,.6+i*.7);s+=`<circle class="led" style="animation-delay:${i*.35}s" cx="${x+2}" cy="${y}" r="1.7" fill="${i?'#8fd1b0':'#9db2f2'}"/>`});
  s+=plant(.2,.2);
  // meja: baris belakang dulu
  s+=desk("asli")+desk("goto");
  s+=plant(9.2,3.7);
  s+=desk("kamis")+desk("emas");
  // sofa kecil & tanaman depan
  s+=plant(9.2,9.2);
  $("scene").innerHTML=s;
  $("tags").innerHTML=ORDER.map(k=>`<div class="tag" id="tag_${k}"><i></i><span>${BOTS[k].emoji} ${BOTS[k].nama}</span></div>`).join("");
}

function todayTrade(k){ const w=wib(); const d=w.toISOString().slice(0,10); return TR[k].find(t=>t.tanggal===d); }
function stateOf(k){
  const w=wib(), mins=w.getUTCHours()*60+w.getUTCMinutes(), dow=w.getUTCDay(), day=w.getUTCDate();
  const res = t => t ? (+t.R>0?"menang":"kalah") : "hitung";
  if(k==="goto"||k==="asli"){
    const ex = k==="goto"?500:510;
    if(GOTOBI.includes(day)&&dow>0&&dow<6){
      if(mins>=450&&mins<475) return "siaga";
      if(mins>=475&&mins<ex) return "posisi";
      if(mins>=ex&&mins<720) return res(todayTrade(k));
    }
    return mins<300?"tidur":"bengong";
  }
  if(k==="kamis"){
    if(dow===4){
      if(mins>=120&&mins<135) return "siaga";
      if(mins>=135&&mins<170) return "posisi";
      if(mins>=170&&mins<600) return res(todayTrade(k));
    }
    return (mins>=540&&mins<1020)?"tidur":"bengong";
  }
  // emas: pakai jam New York
  const p=nyParts(new Date()), nm=p.h*60+p.mi;
  if(p.dow>=1&&p.dow<=4){
    if(nm>=960&&nm<990) return "siaga";
    if(nm>=990) return "posisi";
  }
  if(p.dow>=2&&p.dow<=5){
    if(nm<180) return "posisi";
    if(nm>=180&&nm<600) return res(todayTrade(k));
  }
  return "bengong";
}
const ANIM={bengong:"bob",tidur:"sleep",siaga:"bob type",posisi:"type",hitung:"type",menang:"party",kalah:"sad"};
const TAGS={bengong:"Standby",tidur:"Tidur",siaga:"Siaga",posisi:"Posisi terbuka",hitung:"Menghitung",menang:"Profit",kalah:"Kena SL"};

let SPEAKER=null, turn=0;
function updateStates(){
  ORDER.forEach(k=>{
    const st=stateOf(k);
    $("bot_"+k).setAttribute("class",ANIM[st]);
    $("zzz_"+k).style.display = st==="tidur"?"":"none";
    const tg=$("tag_"+k); tg.querySelector("span").textContent=`${BOTS[k].emoji} ${BOTS[k].nama}, ${TAGS[st].toLowerCase()}`;
    tg.querySelector("i").style.background=DOT[st]||"var(--blue)";
  });
}

    const gp=+g.pips, ap=+a.pips;
    line = SPEAKER==="goto" ? (gp>=ap?`Hari ini aku ${gp.toFixed(1)} pip, Asli ${ap.toFixed(1)}. Close 08:20 menang lagi 😎`:`Asli ${ap.toFixed(1)} pip, aku ${gp.toFixed(1)}. Oke, hari ini kamu menang, Pak 🙇`)

  const b=$("bubble"); b.classList.add("hide");
  setTimeout(()=>{ $("who").textContent=BOTS[SPEAKER].emoji+" "+BOTS[SPEAKER].nama;
    document.querySelectorAll(".tag").forEach(t=>t.classList.toggle("me",t.id==="tag_"+SPEAKER)); $("room").classList.toggle("focus",TAB==="all"); $("who").style.color="var(--accent)";
    $("say").textContent=line; placeOverlays(); b.classList.remove("hide"); },380);
}
function tick(){
  const now=wib(); $("clock").textContent=fmtTime(now);
  const h=now.getUTCHours()%12, m=now.getUTCMinutes();
  const cx=+$("hh").getAttribute("x1"), cy=+$("hh").getAttribute("y1");
  $("hh").setAttribute("transform",`rotate(${h*30+m/2} ${cx} ${cy})`);
  $("mh").setAttribute("transform",`rotate(${m*6} ${cx} ${cy})`);
  const H=now.getUTCHours(), night=H<5||H>=19, dusk=H>=17&&H<19;
  document.documentElement.style.setProperty("--room-light", night?0.82:dusk?0.93:1);
  $("sky1").setAttribute("stop-color",night?"#2a2f55":dusk?"#e9a98a":"#9ecbf0");
  $("sky2").setAttribute("stop-color",night?"#4a5185":dusk?"#f3d1b4":"#d9ebf8");
  $("sun").querySelector("circle").setAttribute("fill",night?"#e6e6f5":"#f3d38b");
  const ng=toWib(nextGotobi()); $("cal").textContent=ng.getUTCDate();
  renderSched();
}
function render(){ renderTabs(); renderBoard(false); renderFeed(); renderSched(); updateStates(); }

/* ===================== MULAI ===================== */
function applyTheme(){
  let th=null;
  try{ if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.colorScheme) th=Telegram.WebApp.colorScheme; }catch(e){}
  if(th) document.documentElement.dataset.theme=th;
  const bg=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try{ Telegram.WebApp.setHeaderColor(bg); Telegram.WebApp.setBackgroundColor(bg); }catch(e){}
}
if(window.Telegram && Telegram.WebApp){ try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.onEvent("themeChanged",applyTheme);}catch(e){} }
applyTheme();
scene(); render(); placeOverlays(); window.addEventListener("resize",()=>{placeOverlays();moveInd();});
tick(); setInterval(tick,1000);
loadAll().then(think); setInterval(think,6500); setInterval(updateStates,30000);
setInterval(loadAll,5*60*1000);
</script>
